<!doctype html>
<!-- conversation.html -->
<html lang="en"><head><meta charset="utf-8"><title>Conversation fixture</title></head>
<body>
<main>
  <div data-message-author-role="user" class="msg user">question text that must not be saved</div>
  <div data-message-author-role="assistant" class="msg assistant markdown"><p>reply text that must not be saved</p></div>
  <textarea aria-label="Message"></textarea>
