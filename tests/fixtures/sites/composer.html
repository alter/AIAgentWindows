<!doctype html>
<!-- composer.html -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Composer fixture</title></head>
  <body>
    <nav id="history"><ul><li>Older chat about cats</li></ul></nav>
    <main id="log"><div class="msg assistant">Welcome. Ask me anything.</div></main>
    <footer id="disclaimer">The model can make mistakes.</footer>
    <form id="composer" onsubmit="return false">
      <textarea id="decoy" aria-label="Hidden fallback" hidden></textarea>
      <textarea id="ta" aria-label="Message"></textarea>
      <div id="ce" contenteditable="true" role="textbox" aria-label="Message"><p></p></div>
      <button id="attach" type="button" aria-label="Attach file">+</button>
      <button id="mic" type="button" aria-label="Voice input">mic</button>
      <button id="send" type="button" aria-label="Send message" disabled>Send</button>
      <button id="stop" type="button" aria-label="Stop generating" hidden>Stop</button>
      <input id="file" type="file" />
    </form>
    <ol id="nav" tabindex="0"></ol>
    <aside id="extra" hidden><textarea id="extra-ta" aria-label="Feedback"></textarea></aside>
    <script>
      const query = new URLSearchParams(location.search);
      const composerKind = query.get('composer') === 'editable' ? 'editable' : 'textarea';
      const ta = document.getElementById('ta');
      const ce = document.getElementById('ce');
      const send = document.getElementById('send');
      const stop = document.getElementById('stop');
      if (query.has('nomain')) {
        const plain = document.createElement('div');
        plain.id = 'log';
        plain.innerHTML = document.getElementById('log').innerHTML;
        document.getElementById('log').replaceWith(plain);
      }
      if (query.has('second')) document.getElementById('extra').hidden = false;
      let log = document.getElementById('log');
      if (query.has('labels')) {
        const thread = document.createElement('div');
        thread.id = 'thread';
        thread.innerHTML = '<div class="msg assistant">Earlier answer.<p>AI-generated, for reference only</p></div>';
        const tools = document.createElement('div');
        tools.innerHTML = '<span>Deep thinking</span> <span>Smart Search</span><p>AI-generated, for reference only</p>';
        log.replaceChildren(thread, tools);
        log = thread;
      }
      const history = document.querySelector('#history ul');
      const navList = document.getElementById('nav');
      const asked = [];
      function renderNav() {
        const clip = query.get('nav') === 'ellipsis';
        navList.replaceChildren(...asked.map((entry) => {
          const item = document.createElement('li');
          const line = entry.replace(/\s+/g, ' ').trim();
          item.textContent = clip ? line.slice(0, 40) + '\u2026' : line;
          return item;
        }));
      }
      window.attachClicks = 0;
      window.micClicks = 0;
      window.submissions = 0;
      if (composerKind === 'editable') ta.hidden = true;
      else ce.hidden = true;
      if (query.has('exec')) {
        document.execCommand = (name, _ui, value) => {
          if (name !== 'insertText') return false;
          ce.replaceChildren(...String(value).split('\n').map((line) => {
            const row = document.createElement('p');
            row.textContent = line;
            return row;
          }));
          ce.dispatchEvent(new InputEvent('input', { bubbles: true }));
          return true;
        };
      }
      if (query.has('badexec')) document.execCommand = () => false;

      function ceText() {
        return Array.from(ce.children).map((kid) => kid.textContent).join('\n');
      }
      function pending() {
        return composerKind === 'editable' ? ceText() : ta.value;
      }
      function refresh() {
        send.disabled = pending().trim() === '' || query.has('sendoff');
      }
      function add(role, lines) {
        const node = document.createElement('div');
        node.className = 'msg ' + role;
        for (const line of lines) {
          const row = document.createElement('p');
          row.textContent = line;
          node.appendChild(row);
        }
        log.appendChild(node);
        return node;
      }
      function submit() {
        const text = pending();
        if (text.trim() === '') return;
        window.submissions += 1;
        ta.value = '';
        ce.replaceChildren(document.createElement('p'));
        refresh();
        if (!query.has('noecho')) add('user', query.has('oneline') ? [text.replace(/\s+/g, ' ')] : text.split('\n'));
        asked.push(text);
        if (query.has('nav') && asked.length >= 2) renderNav();
        const item = document.createElement('li');
        item.textContent = 'Chat ' + window.submissions + ' about ' + text.slice(0, 5);
        history.appendChild(item);
        if (query.has('title')) {
          setTimeout(() => { item.textContent = 'Sculpture drawing style title'; }, 60);
        }
        if (query.has('sidebar')) {
          const tag = document.createElement('div');
          tag.innerHTML = '<span>New chat</span><p>AI-generated, for reference only</p>';
          log.appendChild(tag);
        }
        if (query.has('tag')) {
          const note = document.createElement('div');
          note.textContent = query.get('tag');
          log.appendChild(note);
        }
        if (query.has('silent')) return;
        const think = Number(query.get('think') || 0);
        if (think > 0) setTimeout(stream, think, text);
        else stream(text);
      }
      function stream(text) {
        const gap = Number(query.get('gap') || 0);
        const lock = query.has('lock');
        const stopVisible = !query.has('nostop');
        if (stopVisible) stop.hidden = false;
        if (lock) { ta.disabled = true; ce.removeAttribute('contenteditable'); }
        const reply = add('assistant', []);
        const row = document.createElement('p');
        reply.appendChild(row);
        const fixed = query.get('reply');
        const chunks = fixed === null ? [(query.has('numbered') ? 'ECHO ' + window.submissions + ': ' : 'ECHO: ') + text, ' part-2', ' part-3'] : fixed.split('|');
        let index = 0;
        const step = () => {
          if (fixed === null) row.textContent += chunks[index];
          else reply.appendChild(Object.assign(document.createElement('p'), { textContent: chunks[index] }));
          index += 1;
          if (index < chunks.length) {
            setTimeout(step, gap > 0 && index === 1 ? gap : 40);
            return;
          }
          if (query.has('stall')) {
            const tick = () => { row.textContent += ' ' + Date.now(); setTimeout(tick, 40); };
            tick();
            return;
          }
          stop.hidden = true;
          if (lock) { ta.disabled = false; ce.setAttribute('contenteditable', 'true'); }
        };
        setTimeout(step, 40);
      }
      if (query.has('busy')) {
        const until = Date.now() + Number(query.get('busy'));
        window.ignored = 0;
        const running = add('assistant', []);
        let count = 0;
        const grow = () => {
          count += 1;
          running.appendChild(Object.assign(document.createElement('p'), { textContent: 'Earlier answer still streaming, chunk ' + count }));
          if (Date.now() < until) setTimeout(grow, 40);
        };
        grow();
        const original = submit;
        submit = function () {
          if (Date.now() < until) { window.ignored += 1; return; }
          original();
        };
      }
      for (const [id, key] of [['ta', 'ta'], ['ce', 'ce']]) {
        const el = document.getElementById(id);
        el.addEventListener('input', refresh);
        el.addEventListener('keydown', (event) => {
          if (query.has('noenter')) return;
          if (event.key === 'Enter' && !event.shiftKey) {
            if (query.has('trustedonly') && window.trustedKey !== true) return;
            event.preventDefault();
            submit();
          }
        });
      }
      send.addEventListener('click', () => { if (!query.has('trustedonly')) submit(); });
      document.getElementById('attach').addEventListener('click', () => { window.attachClicks += 1; });
      document.getElementById('mic').addEventListener('click', () => { window.micClicks += 1; });
    </script>
  </body>
</html>
